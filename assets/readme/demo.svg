<svg xmlns="http://www.w3.org/2000/svg" width="860" height="540" viewBox="0 0 860 540" role="img" aria-label="Wax concept demo - player, queue deck, lyrics and the corner vinyl">
  <style>
    .spinV { animation: spin 5s linear infinite; transform-origin: 860px 540px; }
    .prog  { animation: prog 5s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg) } }
    @keyframes prog { from { width: 0 } to { width: 452px } }
    .eq1 { animation: eq 1s  ease-in-out infinite }
    .eq2 { animation: eq 1s .22s ease-in-out infinite }
    .eq3 { animation: eq 1s .44s ease-in-out infinite }
    @keyframes eq { 0%,100% { height:8 } 50% { height:20 } }
    .l1,.l2,.l3 { animation: line 5s linear infinite }
    .l2 { animation-delay: -3.75s } .l3 { animation-delay: -2.5s } .l1 { animation-delay: -1.25s }
    @keyframes line { 0%,24% { opacity:.35 } 27%,45% { opacity:1; fill:#d9a441 } 48%,100% { opacity:.35 } }
  </style>

  <defs>
    <radialGradient id="discD" cx="38%" cy="34%" r="75%">
      <stop offset="0%" stop-color="#26262c"/><stop offset="55%" stop-color="#141418"/><stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <clipPath id="discClipD"><circle cx="860" cy="540" r="150"/></clipPath>
    <linearGradient id="coverHot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6b35a"/><stop offset="1" stop-color="#8a5c1d"/>
    </linearGradient>
  </defs>

  <rect width="860" height="540" fill="#141418"/>

  <!-- app window -->
  <g>
    <rect x="24" y="24" width="614" height="492" rx="14" fill="#1e1e25" stroke="#35353e"/>

    <!-- tab rail -->
    <g fill="#26262e">
      <rect x="44" y="112" width="34" height="34" rx="9"/>
      <rect x="44" y="168" width="34" height="34" rx="9" fill="#d9a441"/>
      <rect x="44" y="224" width="34" height="34" rx="9"/>
      <rect x="44" y="280" width="34" height="34" rx="9"/>
      <rect x="44" y="446" width="34" height="34" rx="9"/>
    </g>
    <g stroke="#9b9890" stroke-width="2" stroke-linecap="round" fill="none">
      <circle cx="61" cy="127" r="7"/><line x1="66" y1="132" x2="71" y2="137"/>
      <line x1="53" y1="185.5" x2="53" y2="184.5"/><g stroke="#141418">
        <line x1="54" y1="179" x2="54" y2="191"/><line x1="61" y1="177" x2="61" y2="193"/><line x1="68" y1="181" x2="68" y2="189"/>
      </g>
      <circle cx="61" cy="239" r="6"/><circle cx="61" cy="239" r="2" fill="#9b9890"/>
      <circle cx="61" cy="295" r="7"/><circle cx="61" cy="295" r="2.5"/>
      <circle cx="61" cy="463" r="5"/><line x1="56" y1="469" x2="66" y2="469"/>
    </g>

    <!-- search field -->
    <rect x="98" y="52" width="380" height="36" rx="9" fill="#26262e" stroke="#35353e"/>
    <circle cx="118" cy="70" r="6" stroke="#67655e" stroke-width="2" fill="none"/>
    <line x1="122" y1="74" x2="127" y2="79" stroke="#67655e" stroke-width="2" stroke-linecap="round"/>
    <text x="138" y="75" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#67655e">artists, songs, albums…</text>
    <rect x="520" y="52" width="94" height="36" rx="9" fill="#26262e"/>
    <text x="540" y="75" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#d9a441">Ctrl+F</text>

    <!-- track rows: the second one is playing -->
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
      <rect x="98" y="106" width="40" height="40" rx="7" fill="#2c2c35"/>
      <text x="152" y="123" font-size="15" fill="#e9e6df">Gravity</text>
      <text x="152" y="140" font-size="12.5" fill="#67655e">The Pine Restructure — 3:41</text>

      <rect x="94" y="162" width="492" height="48" rx="10" fill="#26262e" stroke="#d9a441" stroke-opacity=".55"/>
      <rect x="102" y="166" width="40" height="40" rx="7" fill="url(#coverHot)"/>
      <text x="156" y="185" font-size="15" font-weight="600" fill="#d9a441">Rewind Tape</text>
      <text x="156" y="202" font-size="12.5" fill="#9b9890">Midnight Cassette — 4:12</text>
      <g fill="#d9a441">
        <rect class="eq1" x="548" y="184" width="4" height="10" rx="2"/>
        <rect class="eq2" x="556" y="180" width="4" height="14" rx="2"/>
        <rect class="eq3" x="564" y="182" width="4" height="12" rx="2"/>
      </g>

      <rect x="98" y="222" width="40" height="40" rx="7" fill="#2c2c35"/>
      <text x="152" y="239" font-size="15" fill="#e9e6df">Low Orbit</text>
      <text x="152" y="256" font-size="12.5" fill="#67655e">Sora &amp; The Dust — 5:07</text>

      <rect x="98" y="278" width="40" height="40" rx="7" fill="#2c2c35"/>
      <text x="152" y="295" font-size="15" fill="#e9e6df">Amber statically calm</text>
      <text x="152" y="312" font-size="12.5" fill="#67655e">Hollow FM — 3:58</text>
    </g>

    <!-- player bar: progress filling over the loop, transport icons -->
    <rect x="98" y="446" width="452" height="4" rx="2" fill="#35353e"/>
    <rect class="prog" x="98" y="446" height="4" rx="2" fill="#d9a441"/>
    <circle cx="522" cy="448" r="13" fill="#d9a441"/>
    <path d="M518 442 L528 448 L518 454 Z" fill="#141418"/>
    <text x="110" y="440" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#67655e">0:42 / 4:12</text>
  </g>

  <!-- lyrics bubble, glassmorphism -->
  <g>
    <rect x="560" y="96" width="272" height="132" rx="14" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".14"/>
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5">
      <text class="l2" x="582" y="130" fill="#e9e6df">a warm needle drops, the room exhales</text>
      <text class="l1" x="582" y="162" fill="#e9e6df">static hums beneath the amber light</text>
      <text class="l3" x="582" y="194" fill="#e9e6df">every rewind spins both of us back</text>
    </g>
  </g>

  <!-- screen-corner vinyl, quarter visible like the real app -->
  <g clip-path="url(#discClipD)">
    <g class="spinV">
      <circle cx="860" cy="540" r="150" fill="url(#discD)" stroke="#35353e"/>
      <g fill="none" stroke="#000" stroke-opacity=".5">
        <circle cx="860" cy="540" r="74"/><circle cx="860" cy="540" r="92"/>
        <circle cx="860" cy="540" r="110"/><circle cx="860" cy="540" r="128"/>
        <circle cx="860" cy="540" r="142"/>
      </g>
      <circle cx="860" cy="540" r="58" fill="#d9a441"/>
      <path d="M802 540 a58 58 0 0 0 116 0 Z" fill="#000" fill-opacity=".18"/>
      <circle cx="860" cy="540" r="56" fill="none" stroke="#b08030"/>
      <circle cx="860" cy="540" r="9" fill="#141418"/>
      <line x1="912" y1="512" x2="922" y2="504" stroke="#d9a441" stroke-opacity=".65" stroke-width="5" stroke-linecap="round"/>
    </g>
    <rect x="710" y="390" width="80" height="300" fill="#ffffff" fill-opacity=".05" transform="rotate(18 860 540)"/>
  </g>
</svg>
